<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מוודי — התחברות</title>
  <style>
    /* ─── Design Tokens (Modern Warm) ─── */
    :root {
      --bg-warm: #fff7f0;
      --bg-warm-2: #ffeedd;
      --navy: #1e2a4a;
      --navy-deep: #131c36;
      --orange: #ea580c;
      --orange-light: #fb923c;
      --orange-deep: #c2410c;
      --orange-soft: #fff1e6;
      --text: #1e293b;
      --text-muted: #64748b;
      --text-soft: #94a3b8;
      --border: #f0d9c4;
      --border-soft: #fde4cf;
      --white: #ffffff;
      --shadow-sm: 0 1px 2px rgba(234,88,12,0.05);
      --shadow-md: 0 6px 24px -8px rgba(234,88,12,0.18), 0 2px 6px rgba(30,42,74,0.06);
      --shadow-lg: 0 20px 50px -16px rgba(234,88,12,0.28), 0 4px 12px rgba(30,42,74,0.08);
      --shadow-glow: 0 0 0 4px rgba(234,88,12,0.12);
      --grad-orange: linear-gradient(135deg, #fb923c 0%, #ea580c 55%, #c2410c 100%);
      --grad-bg: radial-gradient(1200px 800px at 80% -10%, #ffe8d4 0%, transparent 60%),
                 radial-gradient(900px 700px at -10% 110%, #ffd9b8 0%, transparent 55%),
                 linear-gradient(180deg, #fff7f0 0%, #fff1e6 100%);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--grad-bg);
      font-family: 'Heebo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px 16px;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .card {
      background: var(--white);
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      padding: 44px 38px 38px;
      width: 100%;
      max-width: 440px;
      border: 1px solid rgba(255,255,255,0.8);
      position: relative;
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      padding: 1.5px;
      background: linear-gradient(135deg, rgba(251,146,60,0.35), rgba(30,42,74,0.05));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      pointer-events: none;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo */
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      object-fit: cover;
      transform: rotate(-3deg);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 10px 24px -6px rgba(234,88,12,0.4);
    }
    .logo-icon:hover { transform: rotate(0deg) scale(1.05); }

    .logo-name {
      font-size: 28px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.6px;
    }

    .tagline {
      text-align: center;
      color: var(--text-muted);
      font-size: 14.5px;
      line-height: 1.65;
      margin-bottom: 32px;
    }

    /* Form */
    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 7px;
      letter-spacing: -0.1px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: #fffaf5;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s, transform 0.1s;
      outline: none;
      direction: ltr;
      text-align: right;
    }

    input[type="text"]:hover,
    input[type="password"]:hover {
      border-color: var(--orange-light);
      background: #fff;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--orange);
      box-shadow: var(--shadow-glow);
      background: #fff;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--grad-orange);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 8px 20px -6px rgba(234,88,12,0.45);
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: -0.1px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px -8px rgba(234,88,12,0.55);
    }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; box-shadow: none; }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-msg {
      display: none;
      color: #b91c1c;
      background: linear-gradient(180deg, #fef2f2, #fee2e2);
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 14px;
      text-align: center;
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* Success */
    .success-box {
      display: none;
      text-align: center;
      padding: 8px 0;
      animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .success-icon {
      font-size: 56px;
      margin-bottom: 14px;
      display: inline-block;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    .success-label {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 500;
    }

    .code-display {
      font-size: 48px;
      font-weight: 900;
      color: var(--orange-deep);
      letter-spacing: 10px;
      background: linear-gradient(135deg, #fff1e6, #ffe2cc);
      border: 1.5px solid var(--border-soft);
      border-radius: 16px;
      padding: 20px 28px;
      margin: 12px 0 22px;
      display: inline-block;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 4px 12px -4px rgba(234,88,12,0.2);
      font-family: 'Heebo', monospace;
    }

    .success-instructions {
      font-size: 15px;
      color: #374151;
      line-height: 1.75;
    }

    .success-instructions .timer {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 700;
      color: var(--orange-deep);
      background: var(--orange-soft);
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 6px;
    }


    @media (max-width: 480px) {
      body { padding: 16px 12px; overflow-x: hidden; }
      .card { padding: 32px 24px 28px; border-radius: 20px; }
      .logo-name { font-size: 24px; }
      .code-display { font-size: 40px; letter-spacing: 8px; padding: 16px 20px; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card">
    <!-- Logo -->
    <div class="logo">
      <img class="logo-icon" src="/static/logo.png" alt="מודי לוגו" />
      <span class="logo-name">מוודי</span>
    </div>

    <p class="tagline">התחבר עם פרטי BGU שלך כדי לחבר את מוודי למודל שלך</p>

    <!-- Login form -->
    <form id="loginForm">
      <input type="hidden" id="phone" name="phone" />

      <div class="field">
        <label for="username">שם משתמש</label>
        <input type="text" id="username" name="username" autocomplete="username"
               placeholder="מספר ת.ז. או שם משתמש BGU" required />
      </div>

      <div class="field">
        <label for="password">סיסמה</label>
        <input type="password" id="password" name="password" autocomplete="current-password"
               placeholder="••••••••" required />
      </div>

      <button class="btn" id="submitBtn" type="submit">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">התחבר</span>
      </button>

      <div class="error-msg" id="errorMsg">שם משתמש או סיסמה שגויים, נסה שוב</div>
    </form>

    <!-- Success state -->
    <div class="success-box" id="successBox">
      <div class="success-icon">✅</div>
      <div class="success-label">הקוד שלך הוא</div>
      <div class="code-display" id="codeDisplay"></div>
      <div class="success-instructions">
        שלח אותו למוודי בוואטסאפ<br />
        <span class="timer">⏱ תוך 10 דקות</span>
      </div>
    </div>
  </div>

  <script>
    // Populate phone from ?phone= query param
    const params = new URLSearchParams(window.location.search);
    const phone = params.get('phone') || '';
    document.getElementById('phone').value = phone;

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const errorMsg = document.getElementById('errorMsg');
    const successBox = document.getElementById('successBox');
    const codeDisplay = document.getElementById('codeDisplay');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Loading state
      submitBtn.disabled = true;
      spinner.style.display = 'block';
      btnText.textContent = 'מתחבר...';
      errorMsg.style.display = 'none';

      const body = {
        phone: document.getElementById('phone').value,
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'שגיאה לא ידועה');
        }

        // Success
        form.style.display = 'none';
        codeDisplay.textContent = data.code;
        successBox.style.display = 'block';

      } catch (err) {
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'התחבר';
      }
    });
  </script>
</body>
</html>
